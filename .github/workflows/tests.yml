name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: OrderFlow/global.json

      - name: Restore
        run: dotnet restore OrderFlow/OrderFlow.sln

      - name: Build
        run: dotnet build OrderFlow/OrderFlow.sln --no-restore -c Release

      - name: Test
        run: dotnet test OrderFlow/OrderFlow.sln --no-build -c Release
